<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Research Workstation — client-side literature review & thesis writing workspace with WebLLM-powered chat, paper upload, and grounded drafting.">
<meta name="theme-color" content="#2563eb">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<title>Research Workstation</title>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="logo"><span class="em">📚</span> Research Workstation</div>
    <div class="brand-sub">answerthis-style research, free &amp; in-browser</div>
    <nav id="nav">
      <button class="nav-btn" data-route="upload"><span class="ic">📄</span> Upload &amp; Chat</button>
      <button class="nav-btn" data-route="search"><span class="ic">🔍</span> Literature Search <span class="nav-count" id="cnt-papers">0</span></button>
      <button class="nav-btn" data-route="deepsearch"><span class="ic">🌀</span> Deep Search</button>
      <button class="nav-btn" data-route="chat"><span class="ic">💬</span> Paper Q&amp;A</button>
      <button class="nav-btn" data-route="audio"><span class="ic">🎧</span> Audio Overview</button>
      <button class="nav-btn" data-route="gap"><span class="ic">🔭</span> Research Gaps</button>
      <button class="nav-btn" data-route="matrix"><span class="ic">🔬</span> Evidence Matrix</button>
      <button class="nav-btn" data-route="consensus"><span class="ic">⚖️</span> Agreement Meter</button>
      <button class="nav-btn" data-route="citecontext"><span class="ic">🔗</span> Citation Context</button>
      <button class="nav-btn" data-route="simgraph"><span class="ic">🕸️</span> Similarity Graph</button>
      <button class="nav-btn" data-route="timeline"><span class="ic">🗺️</span> Citation Timeline</button>
      <button class="nav-btn" data-route="flashcards"><span class="ic">🎴</span> Flashcards</button>
      <button class="nav-btn" data-route="writer"><span class="ic">✍️</span> AI Writer</button>
      <button class="nav-btn" data-route="pad"><span class="ic">🪄</span> Write Pad</button>
      <button class="nav-btn" data-route="workspace"><span class="ic">📝</span> Thesis Workspace</button>
      <button class="nav-btn" data-route="notes"><span class="ic">📌</span> Resource Board <span class="nav-count" id="cnt-notes">0</span></button>
      <button class="nav-btn" data-route="citations"><span class="ic">📖</span> Citations <span class="nav-count" id="cnt-cites">0</span></button>
      <button class="nav-btn" data-route="scraper"><span class="ic">🕷️</span> Web Scraper <span class="nav-count" id="cnt-scrape">0</span></button>
      <button class="nav-btn" data-route="cleaner"><span class="ic">🧹</span> Document Cleaner</button>
      <button class="nav-btn" data-route="review"><span class="ic">🛡️</span> Integrity Review</button>
      <button class="nav-btn" data-route="checks"><span class="ic">✅</span> Checks Summary</button>
      <button class="nav-btn" data-route="paperpal"><span class="ic">🎓</span> Paperpal</button>
      <button class="nav-btn" data-route="datalab"><span class="ic">🧪</span> Data Lab</button>
      <button class="nav-btn" data-route="settings"><span class="ic">⚙️</span> Settings</button>
    </nav>
    <div class="sidebar-footer">
      <button class="theme-toggle" id="themeToggle"><span id="themeIcon">🌙</span> <span id="themeLabel">Dark mode</span></button>
      <div class="privacy-note"><b>🔒 Private by design.</b> Your documents never leave the browser. Only literature search queries and scrape URLs are sent to public academic APIs / a CORS proxy. LLM runs in-browser via WebLLM.</div>
      <div class="llm-status" id="llmStatus"><span class="dot"></span> WebLLM: not loaded</div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <h1 id="viewTitle">Upload &amp; Chat</h1>
      <div class="topbar-actions" id="topActions"></div>
    </header>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="toast-container" id="toasts"></div>

<!-- Core scripts (loaded in order; modules attach to window.RW namespace) -->
<script src="js/utils.js"></script>
<script src="js/webllm.js"></script>
<script src="js/citations.js"></script>
<script src="js/search.js"></script>
<script src="js/pdf.js"></script>
<script src="js/scraper.js"></script>
<script src="js/chat.js"></script>
<script src="js/gap.js"></script>
<script src="js/writer.js"></script>
<script src="js/workspace.js"></script>
<script src="js/notes.js"></script>
<script src="js/cleaner.js"></script>
<script src="js/checks.js"></script>
<script src="js/integrity.js"></script>
<script src="js/matrix.js"></script>
<script src="js/consensus.js"></script>
<script src="js/citecontext.js"></script>
<script src="js/simgraph.js"></script>
<script src="js/litmaps.js"></script>
<script src="js/flashcards.js"></script>
<script src="js/audio.js"></script>
<script src="js/explain.js"></script>
<script src="js/datalab.js"></script>
<script src="js/jenni.js"></script>
<script src="js/paperpal.js"></script>
<script src="js/deepsearch.js"></script>
<!-- UI render modules -->
<script src="js/search-ui.js"></script>
<script src="js/citations-ui.js"></script>
<script src="js/scraper-ui.js"></script>
<script src="js/upload.js"></script>
<script src="js/integrity-ui.js"></script>
<script src="js/matrix-ui.js"></script>
<script src="js/consensus-ui.js"></script>
<script src="js/citecontext-ui.js"></script>
<script src="js/simgraph-ui.js"></script>
<script src="js/litmaps-ui.js"></script>
<script src="js/flashcards-ui.js"></script>
<script src="js/datalab-ui.js"></script>
<script src="js/paperpal-ui.js"></script>
<script src="js/deepsearch-ui.js"></script>
<script src="js/settings.js"></script>
<!-- App router + init (last) -->
<script src="js/app.js"></script>
</body>
</html>
